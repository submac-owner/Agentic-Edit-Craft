name: format

# Temporary helper: rustfmt the new agent crate and report every formatting difference in the
# tree. Removed once `crates/agent` is formatted in the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Report formatting differences
        run: cargo fmt --all -- --check || true
      - name: Clippy the agent crate
        run: cargo clippy -p agentic-edit-agent --all-targets -- -D warnings || true
      - name: Format the agent crate
        run: cargo fmt -p agentic-edit-agent
      - name: Upload formatted agent crate
        uses: actions/upload-artifact@v4
        with:
          name: formatted-agent
          path: crates/agent
